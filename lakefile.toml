name = "NEO"
version = "0.1.0"
# `lake build` (and CI) builds only the finished part.
# Lookup and SumCheck.soundness are work in progress: build them explicitly,
# e.g. `lake build SumCheck.soundness`.
defaultTargets = ["SumCheck"]

[[lean_lib]]
name = "SumCheck"

[[lean_lib]]
name = "Lookup"

[[lean_exe]]
name = "neo"
root = "Main"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"
